[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-news-ai"
version = "0.1.0"
description = "AI stock trading from news sentiment"
dependencies = [
    "yfinance>=0.2.44",
    "pandas>=2.2.3",
    "numpy>=2.1.1",
    "scikit-learn>=1.5.2",
    "torch>=2.5.1",
    "transformers>=4.46.0",
    "vaderSentiment>=3.3.2",
    "feedparser>=6.0.11",
    "pyyaml>=6.0.2",
    "stable-baselines3>=2.3.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tna"]

[project.optional-dependencies]
docker = [
    "redis>=5.0.8",
    "requests-cache>=1.2.0",
]
