services:
  trader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-news-trader
    volumes:
      - type: bind
        source: ./data
        target: /app/data
      - type: bind
        source: ./models
        target: /app/models
      - type: bind
        source: ./config.yml
        target: /app/config.yml
      - type: bind
        source: ./sources_allowlist.yml
        target: /app/sources_allowlist.yml
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_API_SECRET=${ALPACA_API_SECRET}
      - ALPACA_PAPER=${ALPACA_PAPER}
    command: python scripts/deploy_pipeline.py --loop --sleep-seconds 3600
    restart: unless-stopped
    networks:
      - trading-net
    env_file:
      - .env

  monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-news-monitor
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        
      - type: bind
        source: ./models
        target: /app/models
        
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src
    ports:
      - "8050:8050"
    command: python scripts/monitor_dashboard.py
    restart: unless-stopped
    networks:
      - trading-net
    depends_on:
      - trader

networks:
  trading-net:
    driver: bridge
