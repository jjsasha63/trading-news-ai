services:
  trader:
    build:
      context: .
      dockerfile: Dockerfile
    command: bash -c "python scripts/deploy_pipeline.py --start 2024-01-01 --end $(date +%Y-%m-%d) --loop --sleep-seconds 3600"
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - trading-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env

  monitor:
    build:
      context: .
      dockerfile: Dockerfile
    command: python scripts/monitor_dashboard.py
    restart: unless-stopped
    networks:
      - trading-net
    depends_on:
      - trader

networks:
  trading-net:
    driver: bridge
