services:
  backtest:
    build: .
    volumes:
      - .//app/data
      - ./models:/app/models
    command: python3 run.py scripts/trading/run_backtest.py --start 2020-01-01

  paper:
    build: .
    volumes:
      - .//app/data
      - ./models:/app/models
    ports:
      - "8001:8000"
    command: python3 run.py scripts/trading/paper_trader.py
